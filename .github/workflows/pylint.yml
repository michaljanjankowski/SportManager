name: Pylint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "true"
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "uv==0.12.15"
          uv sync --locked --python "${{ matrix.python-version }}"
          uv pip install "pylint==3.3.9" "pylint-django==2.8.0"
      - name: Check code errors
        # Enforce correctness first; legacy style cleanup is a separate task.
        run: |
          uv run --no-sync python -m pylint --load-plugins=pylint_django --django-settings-module=SportManager.settings --errors-only --disable=imported-auth-user $(git ls-files '*.py')
      - name: Check Django configuration
        run: uv run --no-sync python manage.py check
      - name: Run tests
        run: uv run --no-sync pytest
      - name: Check migrations
        run: uv run --no-sync python manage.py makemigrations --check --dry-run
      - name: Check production settings
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-deployment-check-secret-key-at-least-fifty-characters
          DJANGO_ALLOWED_HOSTS: example.invalid
          DJANGO_HSTS_INCLUDE_SUBDOMAINS: "true"
          DJANGO_HSTS_PRELOAD: "true"
        run: uv run --no-sync python manage.py check --deploy --fail-level WARNING
